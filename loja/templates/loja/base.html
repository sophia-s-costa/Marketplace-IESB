    <!DOCTYPE html>
    <html lang="pt-br">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Marketplace IESB{% endblock %}</title>
    <style>
        :root {
        --texto: #111;
        --suave: #6b6b6b;
        --linha: #e6e6e6;
        --fundo: #fff;
        --fundo-suave: #fafafa;
        --destaque: #111;
        }

        * { box-sizing: border-box; }

        body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--texto);
        background: var(--fundo);
        line-height: 1.5;
        }

        a { color: inherit; }

        /* Cabeçalho */
        header {
        border-bottom: 1px solid var(--linha);
        }
        nav {
        max-width: 1040px;
        margin: 0 auto;
        padding: 18px 24px;
        display: flex;
        align-items: center;
        gap: 28px;
        }
        nav .marca {
        font-weight: 700;
        letter-spacing: -0.02em;
        text-decoration: none;
        margin-right: auto;
        }
        nav a {
        text-decoration: none;
        color: var(--suave);
        font-size: 0.95rem;
        transition: color .15s;
        }
        nav a:hover { color: var(--texto); }
        nav .usuario { font-size: 0.95rem; color: var(--suave); }

        /* Conteúdo */
        main {
        max-width: 1040px;
        margin: 0 auto;
        padding: 40px 24px 80px;
        }
        h1 {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin: 0 0 28px;
        }

        /* Mensagens */
        .msg {
        padding: 12px 16px;
        margin-bottom: 24px;
        border: 1px solid var(--linha);
        border-left: 3px solid var(--texto);
        background: var(--fundo-suave);
        font-size: 0.95rem;
        }
        .msg.success { border-left-color: #1a7f4b; }
        .msg.error   { border-left-color: #c0392b; }
        .msg.warning { border-left-color: #b7791f; }

        /* Catálogo */
        .grade {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 20px;
        }
        .card {
        display: flex;
        flex-direction: column;
        padding: 20px;
        border: 1px solid var(--linha);
        border-radius: 10px;
        background: var(--fundo);
        transition: border-color .15s, transform .15s;
        }
        .card:hover {
        border-color: #bbb;
        transform: translateY(-2px);
        }
        .card h3 {
        margin: 0 0 4px;
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        }
        .card small {
        color: var(--suave);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        }
        .preco {
        margin: 18px 0 16px;
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        }
        .card button { margin-top: auto; }

        /* Botões */
        button {
        font: inherit;
        font-size: 0.9rem;
        padding: 10px 16px;
        border: 1px solid var(--destaque);
        border-radius: 8px;
        background: var(--destaque);
        color: #fff;
        cursor: pointer;
        transition: opacity .15s;
        }
        button:hover { opacity: .85; }
        button:disabled {
        background: var(--fundo-suave);
        border-color: var(--linha);
        color: #aaa;
        cursor: not-allowed;
        opacity: 1;
        }

        /* Carrinho */
        table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 24px;
        }
        th, td {
        padding: 14px 8px;
        text-align: left;
        border-bottom: 1px solid var(--linha);
        }
        th {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--suave);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        }
        tr:last-child th, tr:last-child td {
        border-bottom: none;
        font-size: 1.1rem;
        color: var(--texto);
        text-transform: none;
        letter-spacing: 0;
        }

        @media (max-width: 560px) {
        nav { flex-wrap: wrap; gap: 12px 20px; }
        nav .marca { width: 100%; }
        }
    </style>
    </head>
    <body>
    <header>
        <nav>
        <a class="marca" href="{% url 'catalogo' %}">Marketplace IESB</a>
        <a href="{% url 'catalogo' %}">Catálogo</a>
        <a href="{% url 'carrinho' %}">Carrinho (<span id="contador">0</span>)</a>
        <a href="/admin/">Painel do vendedor</a>
        {% if user.is_authenticated %}
            <span class="usuario">{{ user.username }}</span>
        {% else %}
            <a href="{% url 'rest_framework:login' %}?next=/">Entrar</a>
        {% endif %}
        </nav>
    </header>

    <main>
        {% for message in messages %}
        <div class="msg {{ message.tags }}">{{ message }}</div>
        {% endfor %}

        {% block conteudo %}{% endblock %}
    </main>
    </body>
    </html>
